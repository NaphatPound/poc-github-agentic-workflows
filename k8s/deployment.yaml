apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-agentic-workflows
  labels:
    app: poc-agentic-workflows
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poc-agentic-workflows
  template:
    metadata:
      labels:
        app: poc-agentic-workflows
    spec:
      containers:
        - name: web
          image: ghcr.io/naphatpound/poc-github-agentic-workflows:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
